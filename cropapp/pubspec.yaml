name: cropapp
description: Mobile Crop Disease Detection App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter:
    git:
      url: https://github.com/tensorflow/flutter-tflite.git
  image_picker: ^1.1.2
  image: ^4.2.0
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model.tflite
    - assets/labels.txt

